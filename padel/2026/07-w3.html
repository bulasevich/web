<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Rating Calculator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 768px;
            margin: 0 auto;
            padding: 24px 16px;
            background: #f0f2f5;
            color: #333;
        }
        h1 { margin: 0 0 20px; font-size: 22px; }
        .inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: flex-start;
        }
        .inputs label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #999;
            margin-bottom: 4px;
        }
        .col-nicks { flex: 2; }
        .col-ratings { flex: 1; }
        .col-games { flex: 5; }
        textarea {
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            resize: vertical;
            line-height: 1.6;
            background: #fff;
        }
        textarea:focus { outline: none; border-color: #4a90e2; }
        button {
            background: #4a90e2;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        button:hover { background: #357abd; }
        #results { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; width: 100%; }
        .game-card {
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            overflow-x: auto;
            flex: 1 1 auto;
        }
        .badge {
            display: inline-block;
            background: #eef;
            color: #448;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
        }
        table { border-collapse: collapse; width: 100%; min-width: 100%; }
        th { background: #f7f7f7; padding: 5px 8px; text-align: left; font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; }
        td { padding: 6px 8px; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
        td.num, th.num { text-align: right; }
        tr:last-child td { border-bottom: none; }
        .sep td { border-top: 2px solid #eee; }
        .pos { color: #27ae60; font-weight: 700; }
        .neg { color: #e74c3c; font-weight: 700; }
        .zero { color: #bbb; }
        .standings { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 12px; }
        .rank-num { color: #ccc; width: 30px; }
        @media (max-width: 600px) {
            .inputs { flex-wrap: wrap; }
            .col-nicks { flex: 3; }
            .col-ratings { flex: 1; }
            .col-games { flex: 0 0 100%; }
            .game-card { display: block; width: auto; }
            .standings { display: block; }
        }
    </style>
</head>
<body>
<h1>Padel Rating Calculator</h1>
<div class="inputs">
    <div class="col-nicks">
        <label for="nicks">Players</label>
        <textarea id="nicks" rows="12" placeholder="@Nick"></textarea>
    </div>
    <div class="col-ratings">
        <label for="ratings">Rating</label>
        <textarea id="ratings" rows="12" placeholder="000"></textarea>
    </div>
    <div class="col-games">
        <label for="games">Games</label>
        <textarea id="games" rows="12" placeholder="@A @B 6:1 @C @D"></textarea>
    </div>
</div>
<button onclick="calculate()">Calculate</button>
<div id="results"></div>
<div id="standings"></div>
<script>
function parsePlayers() {
    const nicks = document.getElementById('nicks').value.trim().split('\n');
    const ratings = document.getElementById('ratings').value.trim().split('\n');
    const players = {};
    for (let i = 0; i < nicks.length; i++) {
        const display = nicks[i].trim();
        const key = display.replace('@', '').toLowerCase();
        const rating = parseInt((ratings[i] || '').trim());
        if (key && !isNaN(rating)) {
            players[key] = { display, rating, initial: rating, order: i };
        }
    }
    return players;
}

function parseSessions() {
    let raw = document.getElementById('games').value.replace(/,/g, '');
    raw = raw.replace(/([^\n\r]+)\n[ \t]*(\d+:\d+)[ \t]*\n([^\n\r]+)/g,
        (_, t1, score, t2) => `${t1.trim()} ${score.trim()} ${t2.trim()}`);
    const lines = raw.split('\n');
    const sessions = [];
    let current = [];
    for (const line of lines) {
        const t = line.trim();
        if (!t) {
            if (current.length) { sessions.push(current); current = []; }
            continue;
        }
        const m4 = t.match(/^@?(\S+)\s+@?(\S+)\s+(\d+):(\d+)\s+@?(\S+)\s+@?(\S+)\s*$/i);
        const m2 = !m4 && t.match(/^@?(\S+)\s+@?(\S+)\s+(\d+):(\d+)(.*)/i);
        if (m4) {
            current.push({
                team1: [m4[1].toLowerCase(), m4[2].toLowerCase()],
                score1: parseInt(m4[3]), score2: parseInt(m4[4]),
                team2: [m4[5].toLowerCase(), m4[6].toLowerCase()],
            });
        } else if (m2 && m2[5].trim()) {
            current.push({ parseError: `Cannot parse line: «${t}»` });
        } else if (m2) {
            current.push({
                team1: [m2[1].toLowerCase(), m2[2].toLowerCase()],
                score1: parseInt(m2[3]), score2: parseInt(m2[4]),
                team2: null,
            });
        } else if (t.includes('@') || t.match(/\d+:\d+/)) {
            current.push({ parseError: `Cannot parse line: «${t}»` });
        }
    }
    if (current.length) sessions.push(current);

    for (const session of sessions) {
        const allNicks = new Set();
        session.forEach(g => {
            if (!g.parseError) {
                g.team1.forEach(n => allNicks.add(n));
                if (g.team2) g.team2.forEach(n => allNicks.add(n));
            }
        });
        const hasShort = session.some(g => !g.parseError && g.team2 === null);
        if (hasShort) {
            if (allNicks.size !== 4) {
                session.forEach(g => {
                    if (!g.parseError && g.team2 === null)
                        g.parseError = `Short format requires exactly 4 players in the block (found: ${allNicks.size})`;
                });
            } else {
                session.forEach(g => {
                    if (!g.parseError && g.team2 === null)
                        g.team2 = [...allNicks].filter(n => !g.team1.includes(n));
                });
            }
        }
    }
    return sessions;
}

function runGame(players, game) {
    const nicks4 = [...game.team1, ...game.team2];
    const missing = nicks4.find(n => !players[n]);
    if (missing) {
      return { error: `Player @${missing} not found` };
    }
    if (new Set(nicks4).size !== 4) {
        return { error: `Duplicate player @${nicks4.find((n, i) => nicks4.indexOf(n) !== i)} in one game` };
    }
    const [a1, a2, b1, b2] = nicks4.map(n => players[n]);
    const before = {
        [game.team1[0]]: a1.rating, [game.team1[1]]: a2.rating,
        [game.team2[0]]: b1.rating, [game.team2[1]]: b2.rating,
    };
    const s1 = game.score1, s2 = game.score2;
    const kFactor = (s1 > 5 || s2 > 5) ? 30 : 20;
    const expA = 1 / (1 + Math.pow(10, (b1.rating + b2.rating - a1.rating - a2.rating) / 400));
    const realA = (s1 - s2 > 1) ? 1.0 : (s2 - s1 > 1) ? 0.0 : (s1 > s2) ? 0.75 : (s1 < s2) ? 0.25 : 0.5;
    const delta = kFactor * (realA - expA);
    const after = {
        [game.team1[0]]: a1.rating = Math.round(a1.rating + delta),
        [game.team1[1]]: a2.rating = Math.round(a2.rating + delta),
        [game.team2[0]]: b1.rating = Math.round(b1.rating - delta),
        [game.team2[1]]: b2.rating = Math.round(b2.rating - delta),
    };
    return { before, after, kFactor };
}

function deltaCell(diff) {
    if (diff > 0) return `<td class="pos num">+${diff}</td>`;
    if (diff < 0) return `<td class="neg num">${diff}</td>`;
    return `<td class="zero num">0</td>`;
}

function sessionTableHtml(players, results) {
    let html = `<div class="game-card">
        <table><tr><th style="width:36px" class="num">Score</th><th>Player</th><th class="num">Old</th><th class="num">Δ</th><th style="width:40px" class="num">New</th></tr>`;
    results.forEach(({game, result}, gi) => {
        if (result.error) { html += `<tr><td colspan="5" style="padding:0"><div style="background:#e74c3c;color:#fff;font-size:14px;font-weight:700;padding:8px 12px">⚠ ${result.error}</div></td></tr>`; return; }
        const bold = result.kFactor === 20;
        [game.team1, game.team2].forEach((team, ti) => {
            team.forEach((nick, pi) => {
                const p = players[nick];
                const old = result.before[nick];
                const diff = result.after[nick] - old;
                const isFirst = ti === 0 && pi === 0;
                const isSep = gi > 0 && isFirst;
                const score = bold ? `<strong style="color:#e74c3c">${game.score1}:${game.score2}</strong>` : `${game.score1}:${game.score2}`;
                html += `<tr${isSep ? ' class="sep"' : ''}>
                    ${isFirst ? `<td rowspan="4" class="num" style="font-size:11px;color:#888;vertical-align:top;padding-top:8px">${score}</td>` : ''}
                    <td>${p.display}</td><td class="num">${old}</td>${deltaCell(diff)}<td class="num">${result.after[nick]}</td>
                </tr>`;
            });
        });
    });
    return html + `</table></div>`;
}

let standingsPlayers = null;
let standingsOrder = 'old';

function getSorted() {
    const players = Object.values(standingsPlayers);
    return standingsOrder === 'new'
        ? players.sort((a, b) => b.rating - a.rating)
        : players.sort((a, b) => a.order - b.order);
}

function renderStandings() {
    if (!standingsPlayers) return;
    let rows = '';
    getSorted().forEach((p, i) => {
        const total = p.rating - p.initial;
        rows += `<tr><td class="rank-num num">${i+1}</td><td>${p.display}</td><td class="num">${p.initial}</td>${deltaCell(total)}<td class="num">${p.rating}</td></tr>`;
    });
    document.getElementById('standings-body').innerHTML = rows;
    const chk = document.getElementById('chk-sort');
    if (chk) chk.checked = standingsOrder === 'new';
}

function copyColumn(col, thEl) {
    if (!standingsPlayers) return;
    const getValue = {
        rank:   (p, i) => i + 1,
        player: (p)    => p.display,
        old:    (p)    => p.initial,
        delta:  (p)    => p.rating - p.initial,
        new:    (p)    => p.rating,
    }[col];
    const text = getSorted().map((p, i) => getValue(p, i)).join('\n');
    navigator.clipboard.writeText(text).then(() => {
        const orig = thEl.textContent;
        thEl.textContent = '✓';
        setTimeout(() => thEl.textContent = orig, 1500);
    });
}

function setStandingsOrder(order) {
    standingsOrder = order;
    renderStandings();
}

function standingsHtml(players) {
    standingsPlayers = players;
    return `<div class="standings">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#999;margin:0">Final standings</h2>
            <label style="font-size:12px;color:#999;display:flex;align-items:center;gap:4px;cursor:pointer">
                new sort <input type="checkbox" id="chk-sort" onchange="setStandingsOrder(this.checked?'new':'old')">
            </label>
        </div>
        <table><tr>
            <th class="num"  onclick="copyColumn('rank',   this)" style="cursor:pointer" title="Click to copy">#</th>
            <th              onclick="copyColumn('player', this)" style="cursor:pointer" title="Click to copy">Player</th>
            <th class="num"  onclick="copyColumn('old',    this)" style="cursor:pointer" title="Click to copy">Old</th>
            <th class="num"  onclick="copyColumn('delta',  this)" style="cursor:pointer" title="Click to copy">Δ</th>
            <th class="num"  onclick="copyColumn('new',    this)" style="cursor:pointer" title="Click to copy">New</th>
        </tr><tbody id="standings-body"></tbody></table>
    </div>`;
}

function calculate() {
    const players = parsePlayers();
    const sessions = parseSessions();
    const html = sessions.map(games => {
        const results = games.map(game => ({
            game,
            result: game.parseError ? {error: game.parseError} : runGame(players, game),
        }));
        return sessionTableHtml(players, results);
    }).join('');
    document.getElementById('results').innerHTML = html;
    document.getElementById('standings').innerHTML = standingsHtml(players);
    renderStandings();
}

</script>
</body>
