<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Rating Calculator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 768px;
            margin: 0 auto;
            padding: 24px 16px;
            background: #f0f2f5;
            color: #333;
        }
        h1 { margin: 0 0 20px; font-size: 22px; }

        .inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: flex-start;
        }
        .inputs label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #999;
            margin-bottom: 4px;
        }
        .col-nicks { flex: 2; }
        .col-ratings { flex: 1; }
        .col-games { flex: 5; }

        textarea {
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            resize: vertical;
            line-height: 1.6;
            background: #fff;
        }
        textarea:focus { outline: none; border-color: #4a90e2; }

        button {
            background: #4a90e2;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #357abd; }

        .game-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            margin-bottom: 12px;
            display: inline-block;
            width: auto;
        }
        .game-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }
        .game-team { flex: 1; font-size: 14px; font-weight: 600; }
        .game-team.right { text-align: right; }
        .game-score { flex-shrink: 0; text-align: center; }
        .game-score .score-num { font-size: 16px; font-weight: 700; color: #222; }
        .badge {
            display: inline-block;
            background: #eef;
            color: #448;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
        }

        table { border-collapse: collapse; width: 100%; }
        th { background: #f7f7f7; padding: 5px 12px; text-align: left; font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; }
        td { padding: 6px 12px; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
        tr:last-child td { border-bottom: none; }
        .sep td { border-top: 2px solid #eee; }

        .pos { color: #27ae60; font-weight: 700; }
        .neg { color: #e74c3c; font-weight: 700; }
        .zero { color: #bbb; }

        .standings { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 8px; }
        .rank-num { color: #ccc; width: 30px; }
        .mode-btn { background: #e8e8e8; color: #555; border: none; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .mode-btn:hover { background: #d0d0d0; }
        .mode-btn.active { background: #4a90e2; color: #fff; }

        .error { background: #fff5f5; border-left: 3px solid #e74c3c; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #c0392b; }

        @media (max-width: 600px) {
            .inputs { flex-wrap: wrap; }
            .col-nicks { flex: 3; }
            .col-ratings { flex: 1; }
            .col-games { flex: 0 0 100%; }
            .game-card { display: block; width: auto; }
            .standings { display: block; }
        }
    </style>
</head>
<body>

<h1>Padel Rating Calculator</h1>

<div class="inputs">
    <div class="col-nicks">
        <label>Игроки</label>
        <textarea id="nicks" rows="12" placeholder="@Ник">@Kirsh27
@Motveous
@alexspectr
@BorisUlasevich
@vorobevsa
@Denis_Safin
@MikeWazowski25
@Lehamedtg
@ekgardt
@apriorikrai
@paveltverdyy</textarea>
    </div>
    <div class="col-ratings">
        <label>Рейтинг</label>
        <textarea id="ratings" rows="12" placeholder="000">345
315
292
289
248
247
246
242
206
203
81</textarea>
    </div>
    <div class="col-games">
        <label>Игры</label>
        <textarea id="games" rows="12" placeholder="@A @B 6:1 @C @D">@Lehamedtg @alexspectr 6:2 @apriorikrai @paveltverdyy
@Lehamedtg @apriorikrai 7:5 @alexspectr @paveltverdyy
@Lehamedtg @paveltverdyy 6:4 @alexspectr @apriorikrai

@Lehamedtg @VorobevSA 6:1 @BorisUlasevich @ekgardt
@Lehamedtg @ekgardt 6:7 @BorisUlasevich @VorobevSA
@Lehamedtg @BorisUlasevich 6:3 @VorobevSA @ekgardt</textarea>
    </div>
</div>

<button onclick="calculate()">Рассчитать</button>

<div id="results"></div>

<script>
function parsePlayers() {
    const nicks = document.getElementById('nicks').value.trim().split('\n');
    const ratings = document.getElementById('ratings').value.trim().split('\n');
    const players = {};
    for (let i = 0; i < nicks.length; i++) {
        const display = nicks[i].trim();
        const key = display.replace('@', '').toLowerCase();
        const rating = parseInt((ratings[i] || '').trim());
        if (key && !isNaN(rating)) {
            players[key] = { display, rating, initial: rating, order: i };
        }
    }
    return players;
}

function parseSessions() {
    const lines = document.getElementById('games').value.split('\n');
    const sessions = [];
    let current = [];
    for (const line of lines) {
        const t = line.trim();
        if (!t) {
            if (current.length) { sessions.push(current); current = []; }
            continue;
        }
        const m4 = t.match(/^@(\S+)\s+@(\S+)\s+(\d+):(\d+)\s+@(\S+)\s+@(\S+)\s*$/i);
        const m2raw = !m4 && t.match(/^@(\S+)\s+@(\S+)\s+(\d+):(\d+)(.*)/i);
        const m2 = (m2raw && m2raw[5].trim() === '') ? m2raw : null;
        const m2garbage = (m2raw && m2raw[5].trim() !== '') ? m2raw : null;
        if (m4) {
            current.push({
                team1: [m4[1].toLowerCase(), m4[2].toLowerCase()],
                score1: parseInt(m4[3]), score2: parseInt(m4[4]),
                team2: [m4[5].toLowerCase(), m4[6].toLowerCase()],
            });
        } else if (m2garbage) {
            current.push({ parseError: `Не удалось разобрать строку: «${t}»` });
        } else if (m2) {
            current.push({
                team1: [m2[1].toLowerCase(), m2[2].toLowerCase()],
                score1: parseInt(m2[3]), score2: parseInt(m2[4]),
                team2: null,
            });
        } else if (t.includes('@') || t.match(/\d+:\d+/)) {
            current.push({ parseError: `Не удалось разобрать строку: «${t}»` });
        }
    }
    if (current.length) sessions.push(current);

    for (const session of sessions) {
        const allNicks = new Set();
        session.forEach(g => {
            if (!g.parseError) {
                g.team1.forEach(n => allNicks.add(n));
                if (g.team2) g.team2.forEach(n => allNicks.add(n));
            }
        });
        const hasShort = session.some(g => !g.parseError && g.team2 === null);
        if (hasShort) {
            if (allNicks.size !== 4) {
                session.forEach(g => {
                    if (!g.parseError && g.team2 === null)
                        g.parseError = `Короткий формат работает только при 4 игроках в блоке (найдено: ${allNicks.size})`;
                });
            } else {
                session.forEach(g => {
                    if (!g.parseError && g.team2 === null)
                        g.team2 = [...allNicks].filter(n => !g.team1.includes(n));
                });
            }
        }
    }
    return sessions;
}

function realValue(s1, s2) {
    if (s1 - s2 > 1) return 1.0;
    if (s2 - s1 > 1) return 0.0;
    if (s1 > s2) return 0.75;
    if (s1 < s2) return 0.25;
    return 0.5;
}

function runGame(players, game) {
    const a1 = players[game.team1[0]];
    const a2 = players[game.team1[1]];
    const b1 = players[game.team2[0]];
    const b2 = players[game.team2[1]];

    if (!a1) return { error: `Игрок @${game.team1[0]} не найден` };
    if (!a2) return { error: `Игрок @${game.team1[1]} не найден` };
    if (!b1) return { error: `Игрок @${game.team2[0]} не найден` };
    if (!b2) return { error: `Игрок @${game.team2[1]} не найден` };

    const s1 = game.score1, s2 = game.score2;
    const k = (s1 > 5 || s2 > 5) ? 30 : 20;
    const expA = 1 / (1 + Math.pow(10, ((b1.rating + b2.rating) - (a1.rating + a2.rating)) / 400));
    const realA = realValue(s1, s2);
    const realB = 1 - realA;
    const expB = 1 - expA;

    const before = {
        [game.team1[0]]: a1.rating,
        [game.team1[1]]: a2.rating,
        [game.team2[0]]: b1.rating,
        [game.team2[1]]: b2.rating,
    };

    a1.rating = Math.round(a1.rating + k * (realA - expA));
    a2.rating = Math.round(a2.rating + k * (realA - expA));
    b1.rating = Math.round(b1.rating + k * (realB - expB));
    b2.rating = Math.round(b2.rating + k * (realB - expB));

    const after = {
        [game.team1[0]]: a1.rating,
        [game.team1[1]]: a2.rating,
        [game.team2[0]]: b1.rating,
        [game.team2[1]]: b2.rating,
    };

    return { before, after, k };
}

function deltaCell(diff) {
    if (diff > 0) return `<td class="pos">+${diff}</td>`;
    if (diff < 0) return `<td class="neg">${diff}</td>`;
    return `<td class="zero">0</td>`;
}

function sessionTableHtml(players, results) {
    let html = `<div class="game-card" style="padding:10px 14px">
        <table><tr><th>Счёт</th><th>Игрок</th><th>До</th><th>После</th><th>Δ</th></tr>`;
    results.forEach(({game, result}, gi) => {
        if (result.error) { html += `<tr><td colspan="5" style="padding:0"><div style="background:#e74c3c;color:#fff;font-size:14px;font-weight:700;padding:8px 12px">⚠ ${result.error}</div></td></tr>`; return; }
        const incomplete = result.k === 20 ? ' <span class="badge">неполная</span>' : '';
        [game.team1, game.team2].forEach((team, ti) => {
            team.forEach((nick, pi) => {
                const p = players[nick];
                const old = result.before[nick];
                const diff = result.after[nick] - old;
                const isFirst = ti === 0 && pi === 0;
                const isSep = gi > 0 && isFirst;
                html += `<tr${isSep ? ' class="sep"' : ''}>
                    ${isFirst ? `<td rowspan="4" style="font-size:11px;color:#888;vertical-align:top;padding-top:8px;white-space:nowrap">${game.score1}:${game.score2}${incomplete}</td>` : ''}
                    <td>${p.display}</td><td>${old}</td><td>${result.after[nick]}</td>${deltaCell(diff)}
                </tr>`;
            });
        });
    });
    return html + `</table></div>`;
}

let standingsPlayers = null;
let standingsOrder = 'old';

function renderStandings() {
    if (!standingsPlayers) return;
    const byNew = Object.values(standingsPlayers).sort((a, b) => b.rating - a.rating);
    const byOld = Object.values(standingsPlayers).sort((a, b) => a.order - b.order);
    const sorted = standingsOrder === 'new' ? byNew : byOld;
    let rows = '';
    sorted.forEach((p, i) => {
        const total = p.rating - p.initial;
        rows += `<tr><td class="rank-num">${i+1}</td><td>${p.display}</td><td>${p.rating}</td>${deltaCell(total)}</tr>`;
    });
    document.getElementById('standings-body').innerHTML = rows;
    const chk = document.getElementById('chk-sort');
    if (chk) chk.checked = standingsOrder === 'new';
}

function setStandingsOrder(order) {
    standingsOrder = order;
    renderStandings();
}

function standingsHtml(players) {
    standingsPlayers = players;
    return `<div class="standings">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#999;margin:0">Итоговый рейтинг</h2>
            <label style="font-size:12px;color:#999;display:flex;align-items:center;gap:4px;cursor:pointer">
                сортировка <input type="checkbox" id="chk-sort" onchange="setStandingsOrder(this.checked?'new':'old')">
            </label>
        </div>
        <table><tr><th>#</th><th>Игрок</th><th>Рейтинг</th><th>Δ</th></tr><tbody id="standings-body"></tbody></table>
    </div>`;
}

function calculate() {
    const players = parsePlayers();
    const sessions = parseSessions();
    let html = '';

    for (const games of sessions) {
        const results = [];
        for (const game of games) {
            if (game.parseError) { results.push({game, result: {error: game.parseError}}); continue; }
        const result = runGame(players, game);
            results.push({game, result});
        }
        html += sessionTableHtml(players, results);
    }

    html += standingsHtml(players);
    document.getElementById('results').innerHTML = html;
    renderStandings();
}

calculate();
</script>
</body>
</html>
